[project]
name = "mlcast-fi-fmi-pgm"
version = "0.1.0"
description = "Build a Zarr v3 MLCast dataset from the FMI radar composite PGM archive"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jussi Tiira", email = "jussi.tiira@fmi.fi" },
    { name = "Joonas Karjalainen", email = "joonas.karjalainen@fmi.fi"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyproj>=3.6",
    "xarray>=2025.1",
    "zarr>=3.0.8",
    "numcodecs>=0.15",
    "dask>=2026.8.0",
]

[project.scripts]
fmi-pgm-zarr = "mlcast_fi_fmi_pgm.main:main"

[dependency-groups]
dev = [
    "cartopy>=0.26.0",
    "mlcast-dataset-validator==0.4.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlcast_fi_fmi_pgm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The site python3.12 under /tutka lacks _bz2 (needed by numcodecs); use uv-managed builds.
python-preference = "only-managed"
